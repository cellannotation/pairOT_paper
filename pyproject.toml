[build-system]
requires = ["setuptools>=62.1"]
build-backend = "setuptools.build_meta"

[project]
name = "datasim"
version = "0.1.0"
description = "Connecting cell types accross datasets."
authors = [{name = "Felix Fischer", email = "fe.fischer@icloud.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "anndata>=0.10",
    "jax>=0.4.25",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scanpy>=1.9.8",
    "tqdm>=4.66.2",
    "scipy>=1.12",
    "ott-jax>=0.4.6",
    "plotly>=5.21.0",
    "matplotlib>=3.8.4",
    "scikit-learn>=1.0",
]

[tool.setuptools.package-data]
"datasim.de_testing" = ["resources/*"]

[project.optional-dependencies]
de_testing = [
    "cython>=3.0.11",
    "joblib>=1.4.2",
    "rpy2==3.5.11",
]

[tool.setuptools.packages.find]
exclude = ["notebooks", "scripts"]

[project.urls]
Repository = "https://github.com/cellannotation/dataset-similarity"
